<aside class="rail">
  <a href="{{ "/" | relURL }}" style="border-bottom:none;">
    <span class="rail-name">{{ .Site.Params.name }}</span>
  </a>
  <span class="rail-role">{{ .Site.Params.role }}</span>
  <nav>
    {{ range .Site.Menus.main }}
      <a href="{{ .URL | relURL }}">{{ .Name }}</a>
    {{ end }}
  </nav>
  <div class="rail-meta">
    <a href="{{ .Site.Params.github }}" target="_blank" rel="noopener">GitHub ↗</a>
    <a href="{{ .Site.Params.linkedin }}" target="_blank" rel="noopener">LinkedIn ↗</a>
    <span>{{ .Site.Params.location }}</span>
  </div>
</aside>
