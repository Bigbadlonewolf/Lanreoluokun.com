<header class="site-header">
  <div class="header-inner">
    <a href="{{ "/" | relURL }}" class="header-logo">{{ .Site.Params.name }}</a>
    <nav class="header-nav">
      {{ range .Site.Menus.main }}
        <a href="{{ .URL | relURL }}">{{ .Name }}</a>
      {{ end }}
    </nav>
  </div>
</header>
