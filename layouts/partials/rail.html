<header class="site-header">
  <div class="header-inner">
    <a href="{{ .Site.Home.RelPermalink }}" class="header-logo">{{ .Site.Params.name }}</a>
    <nav class="header-nav">
      {{ range .Site.Menus.main }}
        <a href="{{ .URL | relURL }}">{{ .Name }}</a>
      {{ end }}
      <button type="button" class="theme-toggle" aria-label="Toggle dark mode" title="Toggle dark mode">
        <span class="theme-toggle-sun" aria-hidden="true">☀</span>
        <span class="theme-toggle-moon" aria-hidden="true">☾</span>
      </button>
    </nav>
  </div>
</header>
