<svg viewBox="0 0 820 440" role="img" aria-labelledby="dc1b-title dc1b-desc" xmlns="http://www.w3.org/2000/svg">
  <title id="dc1b-title">The privileged access grant lifecycle</title>
  <desc id="dc1b-desc">An engineer holding read-only access by default raises a request, a second person records an approval, and Privileged Access Manager creates a grant scoped by IAM Condition to one resource. PAM expires the grant on its own; the reference build's own revocation function was deleted rather than kept as a second path. A read-only reconciliation sweep runs on a schedule and writes a flag to the ledger when a grant outlives its window, so an overrun is detected inside roughly one sweep. It detects an overrun; it does not contain one. Every event lands in an append-only ledger, which is both the control record and the regulator's evidence.</desc>

  <defs>
    <marker id="dc1b-a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path class="d-arrow" d="M0 0 L10 5 L0 10 z"/>
    </marker>
  </defs>

  <!-- The happy path -->
  <rect class="d-box" x="28" y="56" width="120" height="58" rx="10"/>
  <text class="d-t" x="88" y="82" text-anchor="middle">Engineer</text>
  <text class="d-t-sm" x="88" y="100" text-anchor="middle">read-only by default</text>

  <path class="d-edge" d="M148 85 L174 85" marker-end="url(#dc1b-a)"/>

  <rect class="d-box" x="178" y="56" width="118" height="58" rx="10"/>
  <text class="d-t" x="237" y="82" text-anchor="middle">Request</text>
  <text class="d-t-sm" x="237" y="100" text-anchor="middle">a tracked workflow</text>

  <path class="d-edge" d="M296 85 L322 85" marker-end="url(#dc1b-a)"/>

  <rect class="d-box" x="326" y="56" width="130" height="58" rx="10"/>
  <text class="d-t" x="391" y="82" text-anchor="middle">Approval</text>
  <text class="d-t-sm" x="391" y="100" text-anchor="middle">a second person</text>

  <path class="d-edge" d="M456 85 L482 85" marker-end="url(#dc1b-a)"/>

  <rect class="d-box-accent" x="486" y="56" width="170" height="58" rx="10"/>
  <text class="d-t-on-accent" x="571" y="82" text-anchor="middle">PAM grant</text>
  <text class="d-t-on-accent-sm" x="571" y="100" text-anchor="middle">IAM Condition, one resource</text>

  <path class="d-edge" d="M656 85 L682 85" marker-end="url(#dc1b-a)"/>

  <rect class="d-box" x="686" y="56" width="106" height="58" rx="10"/>
  <text class="d-t" x="739" y="82" text-anchor="middle">Expiry</text>
  <text class="d-t-sm" x="739" y="100" text-anchor="middle">PAM, on its own</text>

  <!-- Everything is written down -->
  <path class="d-edge-dash" d="M237 114 V142"/>
  <path class="d-edge-dash" d="M391 114 V142"/>
  <path class="d-edge-dash" d="M571 114 V142"/>
  <path class="d-edge-dash" d="M739 114 V142"/>
  <line class="d-edge-dash" x1="237" y1="142" x2="739" y2="142"/>
  <path class="d-edge-dash" d="M320 142 V338" marker-end="url(#dc1b-a)"/>
  <text class="d-t-sm" x="330" y="292">every event, written once</text>

  <!-- Break-glass -->
  <path class="d-edge-dash" d="M88 114 V166" marker-end="url(#dc1b-a)"/>
  <rect class="d-box-muted" x="28" y="170" width="196" height="76" rx="10"/>
  <text class="d-t" x="126" y="194" text-anchor="middle">Break-glass</text>
  <text class="d-t-sm" x="126" y="212" text-anchor="middle">two people, alarms on use</text>
  <text class="d-t-sm" x="126" y="230" text-anchor="middle">reviewed the next morning</text>

  <!-- Reconciliation -->
  <path class="d-edge-dash" d="M571 142 V166" marker-end="url(#dc1b-a)"/>
  <rect class="d-box" x="430" y="170" width="190" height="76" rx="10"/>
  <text class="d-t" x="525" y="194" text-anchor="middle">Reconcile sweep</text>
  <text class="d-t-sm" x="525" y="212" text-anchor="middle">read-only, on a schedule</text>
  <text class="d-t-sm" x="525" y="230" text-anchor="middle">detected inside one sweep</text>

  <!-- The path that was deleted -->
  <rect class="d-box-muted" x="650" y="170" width="142" height="76" rx="10"/>
  <text class="d-t" x="721" y="194" text-anchor="middle">revoke_access</text>
  <line class="d-strike" x1="672" y1="190" x2="770" y2="190"/>
  <text class="d-t-sm" x="721" y="214" text-anchor="middle">deleted, not defended</text>
  <text class="d-t-sm" x="721" y="231" text-anchor="middle">PAM already owns expiry</text>

  <path class="d-edge" d="M525 246 V260" marker-end="url(#dc1b-a)"/>
  <rect class="d-box-accent" x="470" y="264" width="322" height="44" rx="10"/>
  <text class="d-t-on-accent" x="631" y="291" text-anchor="middle">Detects an overrun. Does not contain one.</text>

  <path class="d-edge" d="M525 308 V338" marker-end="url(#dc1b-a)"/>
  <text class="d-t-sm" x="536" y="330">a flag on the ledger</text>

  <!-- The ledger -->
  <rect class="d-box-muted" x="28" y="344" width="764" height="68" rx="12"/>
  <text class="d-t" x="48" y="370">Append-only ledger</text>
  <text class="d-t-sm" x="48" y="389">Request, approval, grant, expiry, and every overrun flag.</text>
  <text class="d-t-sm" x="48" y="406">The control and the regulator's evidence are the same artifact.</text>
</svg>
