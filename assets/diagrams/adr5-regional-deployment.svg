<svg viewBox="0 0 820 560" role="img" aria-labelledby="adr5-title adr5-desc" xmlns="http://www.w3.org/2000/svg">
  <title id="adr5-title">Regional deployment model with per-region key hierarchies</title>
  <desc id="adr5-desc">A policyholder reaches a global control plane that persists no PII. The jurisdiction router resolves the policyholder to one of four regional stacks: EU in europe-west1, UK in europe-west2, US in us-east1, and APAC in asia-southeast1. Each region holds its own WAF, GKE cluster, Cloud SQL and Cloud Storage under CMEK, a Cloud HSM holding that region's key ring, an immutable WORM backup, and regional audit logs. No key from one region wraps a key from another.</desc>

  <defs>
    <marker id="adr5-a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path class="d-arrow" d="M0 0 L10 5 L0 10 z"/>
    </marker>
    <marker id="adr5-aa" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path class="d-arrow-accent" d="M0 0 L10 5 L0 10 z"/>
    </marker>
  </defs>

  <rect class="d-box" x="330" y="16" width="160" height="36" rx="8"/>
  <text class="d-t" x="410" y="39" text-anchor="middle">Policyholder</text>
  <path class="d-edge" d="M410 52 L410 70" marker-end="url(#adr5-a)"/>
  <text class="d-t-sm" x="420" y="66">TLS 1.3</text>

  <rect class="d-zone" x="28" y="72" width="764" height="88" rx="12"/>
  <text class="d-label" x="44" y="92">GLOBAL CONTROL PLANE · NO PERSISTED PII</text>

  <rect class="d-box" x="42" y="102" width="176" height="44" rx="8"/>
  <text class="d-t-body" x="130" y="122" text-anchor="middle">API Gateway / WAF</text>
  <text class="d-t-sm" x="130" y="138" text-anchor="middle">rate limiting · DDoS</text>

  <rect class="d-box-accent" x="234" y="102" width="176" height="44" rx="8"/>
  <text class="d-t-on-accent" x="322" y="121" text-anchor="middle">Jurisdiction Router</text>
  <text class="d-t-on-accent-sm" x="322" y="137" text-anchor="middle">transient routing ID only</text>

  <rect class="d-box" x="426" y="102" width="176" height="44" rx="8"/>
  <text class="d-t-body" x="514" y="122" text-anchor="middle">IAM / Federation</text>
  <text class="d-t-sm" x="514" y="138" text-anchor="middle">RBAC · ABAC</text>

  <rect class="d-box" x="618" y="102" width="176" height="44" rx="8"/>
  <text class="d-t-body" x="706" y="122" text-anchor="middle">Observability · CI/CD</text>
  <text class="d-t-sm" x="706" y="138" text-anchor="middle">non-PII metrics</text>

  <path class="d-edge-accent" d="M322 146 L322 170"/>
  <path class="d-edge-accent" d="M117 170 L703 170"/>
  <path class="d-edge-accent" d="M117 170 L117 184" marker-end="url(#adr5-aa)"/>
  <path class="d-edge-accent" d="M312 170 L312 184" marker-end="url(#adr5-aa)"/>
  <path class="d-edge-accent" d="M507 170 L507 184" marker-end="url(#adr5-aa)"/>
  <path class="d-edge-accent" d="M703 170 L703 184" marker-end="url(#adr5-aa)"/>

  <rect class="d-zone" x="28" y="186" width="179" height="286" rx="12"/>
  <text class="d-label" x="42" y="208">EU REGION</text>
  <text class="d-t-sm" x="42" y="224">europe-west1</text>
  <rect class="d-box" x="42" y="234" width="151" height="26" rx="6"/>
  <text class="d-t-sm" x="117" y="251" text-anchor="middle">Regional WAF</text>
  <rect class="d-box" x="42" y="266" width="151" height="26" rx="6"/>
  <text class="d-t-sm" x="117" y="283" text-anchor="middle">GKE cluster</text>
  <rect class="d-box" x="42" y="298" width="151" height="26" rx="6"/>
  <text class="d-t-sm" x="117" y="315" text-anchor="middle">Cloud SQL · CMEK</text>
  <rect class="d-box" x="42" y="330" width="151" height="26" rx="6"/>
  <text class="d-t-sm" x="117" y="347" text-anchor="middle">Cloud Storage · CMEK</text>
  <rect class="d-box-accent" x="42" y="362" width="151" height="34" rx="6"/>
  <text class="d-t-on-accent" x="117" y="378" text-anchor="middle">Cloud HSM · EU</text>
  <text class="d-t-on-accent-sm" x="117" y="391" text-anchor="middle">FIPS 140-3 Level 3</text>
  <rect class="d-box-muted" x="42" y="402" width="151" height="32" rx="6"/>
  <text class="d-t-sm" x="117" y="416" text-anchor="middle">Immutable backup</text>
  <text class="d-t-sm" x="117" y="429" text-anchor="middle">WORM object-lock</text>
  <text class="d-t-sm" x="42" y="452">Audit logs → SIEM</text>

  <rect class="d-zone" x="223" y="186" width="179" height="286" rx="12"/>
  <text class="d-label" x="237" y="208">UK REGION</text>
  <text class="d-t-sm" x="237" y="224">europe-west2</text>
  <rect class="d-box" x="237" y="234" width="151" height="26" rx="6"/>
  <text class="d-t-sm" x="312" y="251" text-anchor="middle">Regional WAF</text>
  <rect class="d-box" x="237" y="266" width="151" height="26" rx="6"/>
  <text class="d-t-sm" x="312" y="283" text-anchor="middle">GKE cluster</text>
  <rect class="d-box" x="237" y="298" width="151" height="26" rx="6"/>
  <text class="d-t-sm" x="312" y="315" text-anchor="middle">Cloud SQL · CMEK</text>
  <rect class="d-box" x="237" y="330" width="151" height="26" rx="6"/>
  <text class="d-t-sm" x="312" y="347" text-anchor="middle">Cloud Storage · CMEK</text>
  <rect class="d-box-accent" x="237" y="362" width="151" height="34" rx="6"/>
  <text class="d-t-on-accent" x="312" y="378" text-anchor="middle">Cloud HSM · UK</text>
  <text class="d-t-on-accent-sm" x="312" y="391" text-anchor="middle">FIPS 140-3 Level 3</text>
  <rect class="d-box-muted" x="237" y="402" width="151" height="32" rx="6"/>
  <text class="d-t-sm" x="312" y="416" text-anchor="middle">Immutable backup</text>
  <text class="d-t-sm" x="312" y="429" text-anchor="middle">WORM object-lock</text>
  <text class="d-t-sm" x="237" y="452">Audit logs → SIEM</text>

  <rect class="d-zone" x="418" y="186" width="179" height="286" rx="12"/>
  <text class="d-label" x="432" y="208">US REGION</text>
  <text class="d-t-sm" x="432" y="224">us-east1</text>
  <rect class="d-box" x="432" y="234" width="151" height="26" rx="6"/>
  <text class="d-t-sm" x="507" y="251" text-anchor="middle">Regional WAF</text>
  <rect class="d-box" x="432" y="266" width="151" height="26" rx="6"/>
  <text class="d-t-sm" x="507" y="283" text-anchor="middle">GKE cluster</text>
  <rect class="d-box" x="432" y="298" width="151" height="26" rx="6"/>
  <text class="d-t-sm" x="507" y="315" text-anchor="middle">Cloud SQL · CMEK</text>
  <rect class="d-box" x="432" y="330" width="151" height="26" rx="6"/>
  <text class="d-t-sm" x="507" y="347" text-anchor="middle">Cloud Storage · CMEK</text>
  <rect class="d-box-accent" x="432" y="362" width="151" height="34" rx="6"/>
  <text class="d-t-on-accent" x="507" y="378" text-anchor="middle">Cloud HSM · US</text>
  <text class="d-t-on-accent-sm" x="507" y="391" text-anchor="middle">FIPS 140-3 Level 3</text>
  <rect class="d-box-muted" x="432" y="402" width="151" height="32" rx="6"/>
  <text class="d-t-sm" x="507" y="416" text-anchor="middle">Immutable backup</text>
  <text class="d-t-sm" x="507" y="429" text-anchor="middle">WORM object-lock</text>
  <text class="d-t-sm" x="432" y="452">Audit logs → SIEM</text>

  <rect class="d-zone" x="613" y="186" width="179" height="286" rx="12"/>
  <text class="d-label" x="627" y="208">APAC REGION</text>
  <text class="d-t-sm" x="627" y="224">asia-southeast1</text>
  <rect class="d-box" x="627" y="234" width="151" height="26" rx="6"/>
  <text class="d-t-sm" x="702" y="251" text-anchor="middle">Regional WAF</text>
  <rect class="d-box" x="627" y="266" width="151" height="26" rx="6"/>
  <text class="d-t-sm" x="702" y="283" text-anchor="middle">GKE cluster</text>
  <rect class="d-box" x="627" y="298" width="151" height="26" rx="6"/>
  <text class="d-t-sm" x="702" y="315" text-anchor="middle">Cloud SQL · CMEK</text>
  <rect class="d-box" x="627" y="330" width="151" height="26" rx="6"/>
  <text class="d-t-sm" x="702" y="347" text-anchor="middle">Cloud Storage · CMEK</text>
  <rect class="d-box-accent" x="627" y="362" width="151" height="34" rx="6"/>
  <text class="d-t-on-accent" x="702" y="378" text-anchor="middle">Cloud HSM · APAC</text>
  <text class="d-t-on-accent-sm" x="702" y="391" text-anchor="middle">FIPS 140-3 Level 3</text>
  <rect class="d-box-muted" x="627" y="402" width="151" height="32" rx="6"/>
  <text class="d-t-sm" x="702" y="416" text-anchor="middle">Immutable backup</text>
  <text class="d-t-sm" x="702" y="429" text-anchor="middle">WORM object-lock</text>
  <text class="d-t-sm" x="627" y="452">Audit logs → SIEM</text>

  <rect class="d-box-accent" x="28" y="488" width="764" height="56" rx="10"/>
  <text class="d-t-on-accent" x="410" y="511" text-anchor="middle">Key binding invariant</text>
  <text class="d-t-on-accent-sm" x="410" y="531" text-anchor="middle">region(DEK) == region(data) == region(KEK) == region(ROOT). No key from one region ever wraps a key from another.</text>
</svg>
